      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0
        sparse-checkout: .github
        sparse-checkout-cone-mode: true
    - shell: bash
      run: |
