name: Dispatch Azure Pipelines

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - develop
      - staging
      - main
      - release-staging/rocm-rel-7.*

jobs:
  dispatch-azure-pipelines:
    name: Dispatch Azure Pipelines
    runs-on: ubuntu-latest
    steps:
    - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e # v2.0.6
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        ref: refs/pull/${{ github.event.pull_request.number }}/merge
        sparse-checkout: .github
        sparse-checkout-cone-mode: true
        token: ${{ steps.generate-token.outputs.token }}

    - name: Install python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r .github/requirements.txt

    - name: Run dispatch script
      env:
        GH_TOKEN: ${{ steps.generate-token.outputs.token }}
      run: |
        echo '{
          "definition": {
              "id": "REPLACE_BUILD_DEFINITION_ID"
          },
          "project": {
              "id": "b22b20c4-7700-462e-b80b-76b8222eb8f2"
          },
          "triggerInfo": {
              "pr.sourceBranch": "${{ github.event.pull_request.head.ref }}",
              "pr.sourceSha": "${{ github.event.pull_request.head.sha }}",
              "pr.id": "${{ github.event.pull_request.id }}",
              "pr.title": "${{ github.event.pull_request.title }}",
              "pr.number": "${{ github.event.pull_request.number }}",
              "pr.isFork": "${{ github.event.pull_request.head.repo.fork }}",
              "pr.draft": "${{ github.event.pull_request.draft }}",
              "pr.sender.name": "${{ github.event.pull_request.user.login }}",
              "pr.sender.avatarUrl": "${{ github.event.pull_request.user.avatar_url }}",
              "pr.sender.isExternal": "True",
              "pr.providerId": "github",
              "pr.autoCancel": "true"
          },
          "sourceBranch": "${{ github.ref }}",
          "reason": "pullRequest",
          "parameters": {
              "system.pullRequest.pullRequestId": "${{ github.event.pull_request.id }}",
              "system.pullRequest.pullRequestNumber": "${{ github.event.pull_request.number }}",
              "system.pullRequest.mergedAt": "",
              "system.pullRequest.sourceBranch": "${{ github.event.pull_request.head.ref }}",
              "system.pullRequest.targetBranch": "${{ github.event.pull_request.base.ref }}",
              "system.pullRequest.targetBranchName": "${{ github.event.pull_request.base.ref }}",
              "system.pullRequest.sourceRepositoryUri": "REPLACE_GITHUB_REPO_URI",
              "system.pullRequest.sourceCommitId": "${{ github.event.pull_request.head.sha }}",
              "system.pullRequest.isFork": "${{ github.event.pull_request.head.repo.fork }}"
          }"
        }' > az_request_data.json

        cat az_request_data.json

        python .github/scripts/azure-ci-dispatcher.py \
          --az-pat "$(printf ":${{ secrets.AZ_PAT }}" | base64)" \
          --az-request-data-file "az_request_data.json" \
          --repo "${{ github.repository }}" \
          --pr "${{ github.event.pull_request.number }}" \
          --config ".github/repos-config.json" \
          --require-fanout
