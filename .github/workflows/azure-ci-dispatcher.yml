name: Trigger Pipeline

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - develop
      - staging
      - main
      - release-staging/rocm-rel-7.*

jobs:
  trigger-testing:
    name: Dispatch Azure Pipelines
    runs-on: ubuntu-latest
    steps:
